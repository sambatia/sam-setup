name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint + Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs history
      - name: ShellCheck
        run: |
          shellcheck -S warning \
            bootstrap.sh \
            tests/run-bootstrap-tests.sh \
            .chezmoiscripts/run_once_before_05-backup-existing.sh \
            .chezmoiscripts/run_after_20-ssh-key.sh \
            .chezmoiscripts/run_once_after_30-tmux-tpm.sh \
            dot_local/bin/executable_sam-setup-restore \
            dot_local/bin/executable_sam-setup-check \
            dot_local/bin/executable_sam-setup-help \
            dot_local/bin/executable_update-all
      - name: Secret scan (gitleaks)
        # Direct CLI (not gitleaks-action) — the action builds a <root>^..HEAD
        # commit range that is invalid on a repo's first push. This scans the
        # full history deterministically and fails the build on any finding.
        run: |
          VER=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner

  test:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]   # macOS catches bash 3.2 quirks
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install chezmoi (for template-render checks)
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run unit tests
        run: ./tests/run-bootstrap-tests.sh

  # T11 (deferred): a full brew-bundle install smoke is intentionally NOT run in
  # CI — 117 formulae + casks is slow and some casks prompt for sudo even on a
  # runner. macos-latest is also a WARM box (brew/git/Xcode pre-installed), so it
  # would not validate the cold-start path anyway. The real cold-start test is
  # watching one friend run it on a fresh Mac.
