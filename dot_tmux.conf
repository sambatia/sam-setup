# ---- Prefix: preserve the existing Ctrl+A workflow ----
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ---- Terminal and color support (kept from previous config: true color
#      across Ghostty and other terminals) ----
set -g default-terminal "tmux-256color"
# Reset first: `set -as` appends on every source-file, so without this the
# feature list accumulates duplicates across reloads.
set -su terminal-features
# usstyle = styled/colored undercurls (nvim diagnostics) in Ghostty
set -as terminal-features ",xterm-ghostty:RGB:usstyle"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",screen-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"
set -as terminal-features ",alacritty:RGB"
set -as terminal-features ",wezterm:RGB"
set -as terminal-features ",kitty:RGB"
set -as terminal-features ",foot:RGB"

# ---- Sane defaults ----
set -g mouse off                    # default off; toggle with prefix-m (see below)
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on         # image protocols (kitty graphics) reach Ghostty: Yazi previews etc.
set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY TERM TERM_PROGRAM TERM_PROGRAM_VERSION"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
set -g status-position top          # status bar on top, not buried at the bottom

# ---- Friendlier keybindings ----
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- Oh My Tmux-style extras (added 2026-07-10) ----
# Dual prefix: C-a stays primary (existing workflow); C-b restored as secondary.
# NOTE: the matching `bind C-b send-prefix -2` lives AFTER the tpm run line —
# tmux-sensible unbinds C-b whenever prefix != C-b, clobbering it here.
set -g prefix2 C-b

# Mouse toggle (default off above; bare `set -g mouse` flips the flag)
bind m set -g mouse \; display-message "Mouse: #{?mouse,on,off}"

# Pane maximize-to-window toggle (Oh My Tmux style; real window, splittable)
bind + run-shell '~/.tmux/scripts/pane_maximize.sh "#{pane_id}"'

# URL picker / file path picker from pane scrollback
bind u capture-pane -J \; save-buffer /tmp/tmux-buffer \; split-window -l 10 "urlscan < /tmp/tmux-buffer"
bind f capture-pane -J \; save-buffer /tmp/tmux-buffer \; split-window -l 10 "fpp < /tmp/tmux-buffer"

# ---- Vi-style copy mode with macOS clipboard (kept from previous config) ----
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Escape send -X cancel

# ---- Plugins ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'      # save session layout
set -g @plugin 'tmux-plugins/tmux-continuum'      # auto-save/restore sessions
set -g @plugin 'tmux-plugins/tmux-yank'           # system clipboard integration
set -g @plugin 'christoomey/vim-tmux-navigator'   # Ctrl-h/j/k/l moves seamlessly
                                                    # between vim splits and tmux panes
set -g @plugin 'omerxx/tmux-sessionx'           # prefix O: normal session/project navigation
set -g @plugin 'sainnhe/tmux-fzf'                 # fuzzy session/window/pane picker
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'  # auto per-app window icons (needs yq)
set -g @plugin 'Nybkox/tmux-ukiyo'                # live theme switcher — owns the status bar (prefix T)
# ---- DISABLED 2026-07-10 (visual-polish layer): ukiyo owns the status bar now.
#      Re-enable these two + the catppuccin option block + the battery section
#      after the tpm run line to restore the previous catppuccin v2.3.0 bar.
# set -g @plugin 'catppuccin/tmux#v2.3.0'           # theme — pin the version
# set -g @plugin 'tmux-plugins/tmux-battery'        # battery status (was wired after tpm run below)

# ---- SessionX: prefix-scoped ordinary tmux navigation ----
set -g @sessionx-bind 'O'
set -g @sessionx-prefix 'on'
set -g @sessionx-fzf-builtin-tmux 'on'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-x-path '~/Projects'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '55%'

# ---- workmux: preserve prefix L (resize) and existing switchers ----
bind M-l run-shell 'workmux last-done'
bind Tab run-shell 'workmux last-agent'
# Ukiyo rebuilds window tabs on theme changes. Keep status in the existing
# pane border, which survives those rebuilds; workmux dashboard shows all agents.

# ---- Session persistence behavior ----
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

