# set -g @catppuccin_window_current_text ' #W'
# set -g @catppuccin_pane_status_enabled 'yes'    # gate required by catppuccin v2.x for styled pane borders
# set -g @catppuccin_pane_border_status 'top'
# set -g @catppuccin_pane_default_text '#{b:pane_current_path}'
# set -g @catppuccin_pane_active_border_style '##{?pane_in_mode,fg=#{@thm_lavender},##{?pane_synchronized,fg=#{@thm_mauve},fg=#{@thm_peach}}}'

# ---- Pane border labels (theme-neutral; colors follow ukiyo's border styles) ----
# Also hosts two format jobs that must survive ukiyo's status-line rebuilds
# (ukiyo rewrites status-left/right on every theme apply, but never touches
# pane-border-format):
#   - ssh_status.sh: per-pane ssh/mosh indicator (peach user@host, empty local)
#   - continuum_save.sh: tmux-continuum's autosave trigger; output is always
#     empty, it just needs to execute each refresh. NOTE: autosave relies on
#     pane-border-status staying on.
set -g pane-border-status top
set -g pane-border-format " #{b:pane_current_path}#{?@workmux_status, #{@workmux_status},} #(~/.tmux/scripts/ssh_status.sh '#{pane_tty}')#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)"

# ---- Ukiyo theme switcher (owns status bar, window tabs, borders; prefix T = menu) ----
set -g @ukiyo-theme "catppuccin/mocha"
# Module order = display order. NO "weather" (default list includes it; excluded
# deliberately — wttr.in leaks IP/location per refresh). No "ssh-session" either:
# it would render a permanently-empty pill when local, because show-empty-plugins
# must stay true — setting it false hits an upstream ukiyo bug where the commas
# inside generated #[fg=X,bg=Y] style tokens split the surrounding format
# conditional's branches and every wrapped segment renders empty (verified on
# tmux 3.7b). The ssh indicator lives in pane-border-format instead (above).
set -g @ukiyo-plugins "git cpu-usage ram-usage battery"
set -g @ukiyo-show-empty-plugins true
set -g @ukiyo-left-icon session
# Focused-pane border: theme-supplied. contrast=false uses each theme's "selection"
# color — in ukiyo's mocha palette that's brighter (#585b70) than its "highlight"
# (#45475a). Per-theme colors keep theme switches free of leftover custom colors;
# the old fixed-peach border only made sense when catppuccin owned the bar.
set -g @ukiyo-border-contrast false

# ---- DISABLED 2026-07-10: hand-built status line (ukiyo owns status-left/right now) ----
# set -g status-right-length 100
# set -g status-left-length 100
# set -g status-left ""
# set -g status-interval 5            # ssh indicator forks a process per refresh; keep it cheap
# set -g status-right "#(~/.tmux/scripts/ssh_status.sh '#{pane_tty}')#{E:@catppuccin_status_session} #{E:@catppuccin_status_uptime}"

# ---- Popup session switcher (Alt-j, no prefix) ----
bind -n M-j display-popup -E "tmux list-sessions -F '#{session_name}' | fzf --reverse | xargs tmux switch-client -t"

# ---- Fastfetch splash on genuinely new attached sessions ----
set -g @fastfetch_splash on         # set to 'off' to disable the splash
# NOTE: #{session_name}, not #{hook_session} — the latter expands wrong/empty
# inside session-created on tmux 3.7b; session hooks run with the new session
# as context so session_name is the created session.
set-hook -g session-created 'run-shell -b "~/.tmux/scripts/splash.sh \"#{session_name}\""'

# ---- Initialize TPM ----
run '~/.tmux/plugins/tpm/tpm'

# ---- DISABLED 2026-07-10: catppuccin battery segment (ukiyo battery module replaces it) ----
# set -agF status-right " #{E:@catppuccin_status_battery}"
# run-shell 'test -e ~/.tmux/plugins/tmux-battery/battery.tmux && ~/.tmux/plugins/tmux-battery/battery.tmux || true'

# Dual-prefix passthrough: C-b C-b sends a literal C-b. Must stay below the
# tpm line — tmux-sensible unbinds C-b during plugin load (prefix != C-b).
bind C-b send-prefix -2

# C-l: vim-tmux-navigator binds it to select-pane -R, so in a single pane or
# at the right edge the shell never sees clear-screen. Pass C-l through when
# there is no pane to the right (or vim/fzf is in front); otherwise move right.
# Mirrors herdr's smart-splits passthrough. Must stay below the tpm line.
bind -n C-l if -F '#{||:#{pane_at_right},#{m/ri:^g?(view|l?n?vim?x?|fzf)(diff)?$,#{pane_current_command}}}' 'send-keys C-l' 'select-pane -R'
set -g mouse on
