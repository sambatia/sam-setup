[tools]
node = "24.16.0"
pnpm = "11.8.0"

# Global npm CLIs (the shareable AI-engineering + web-dev core). They live in
# node's prefix, so they're tied to the node version above — after a node bump
# (`mise use -g node@<newer>`) run `mise run node-globals` to reinstall.
# This is a starter set: trim or extend to taste. (Work/account-specific tools
# and eslint/prettier — decided-against in favour of biome — are intentionally out.)
[tasks.node-globals]
description = "Reinstall the global npm CLIs after a node major bump"
run = """
npm install -g \
  @anthropic-ai/claude-code @openai/codex @google/gemini-cli opencode-ai \
  repomix \
  @modelcontextprotocol/server-filesystem @modelcontextprotocol/server-memory \
  @modelcontextprotocol/server-sequential-thinking @modelcontextprotocol/inspector \
  @playwright/mcp @upstash/context7-mcp chrome-devtools-mcp \
  wrangler vercel drizzle-kit turbo tsx typescript playwright tree-sitter-cli
mise reshim
"""
