[tools]
"github:can1357/oh-my-pi" = "latest"
node = "lts"
"npm:@openai/codex" = "latest"
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
# tree-sitter-cli downloads its actual binary in an npm `install` lifecycle
# script. mise's embedded Aube installer denies lifecycle builds unless the
# exact package is reviewed and allowlisted. Without this, the shim is hollow
# and fails with `spawn .../tree-sitter ENOENT`. Required by nvim-treesitter's
# `main` branch, which compiles parsers locally instead of bundling them.
"npm:tree-sitter-cli" = { version = "latest", allow_builds = ["tree-sitter-cli"] }
pnpm = "11.8.0"
"github:librespeed/speedtest-cli" = "latest"

[tasks.node-globals]
description = "Reinstall global npm CLIs after a node major bump"
# Codex, tree-sitter-cli, TypeScript, and TypeScript Language Server are separate
# mise tools above; Claude Code uses its officially supported Homebrew
# latest-channel cask. Do not install any of them into Node's global prefix.
run = """
npm install -g \
  @google/gemini-cli opencode-ai apidog-cli@2.2.8 \
  @earendil-works/pi-coding-agent ccusage repomix gitnexus skills \
  @modelcontextprotocol/server-filesystem @modelcontextprotocol/server-memory \
  @modelcontextprotocol/server-sequential-thinking \
  @upstash/context7-mcp chrome-devtools-mcp mcp-omnisearch @railway/mcp-server \
  wrangler vercel neon @railway/cli drizzle-kit turbo tsx ts-node \
  inngest-cli playwright @modelcontextprotocol/inspector
mise reshim
"""

[settings]
activate_aggressive = true
lockfile = true
