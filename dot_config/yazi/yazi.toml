# Yazi 26.8.15+ configuration. Terminal image protocol selection is automatic.

[mgr]
ratio          = [ 1, 3, 4 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = false
show_symlink   = true
scrolloff      = 5

[preview]
max_width  = 1000
max_height = 1000

# git.yazi fetches repository state for both files and directories. The legacy
# `id = "git"` field is intentionally omitted for Yazi newer than 26.1.22.
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
