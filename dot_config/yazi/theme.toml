# Small Catppuccin Mocha overlay matching Ghostty. Unspecified values continue
# to inherit Yazi's maintained defaults.

[mgr]
border_symbol = "│"
border_style  = { fg = "#585b70" }

[git]
unknown   = { fg = "#6c7086" }
modified  = { fg = "#f9e2af" }
added     = { fg = "#a6e3a1" }
untracked = { fg = "#89b4fa" }
ignored   = { fg = "#6c7086" }
deleted   = { fg = "#f38ba8", bold = true }
updated   = { fg = "#cba6f7" }
clean     = { fg = "#a6e3a1" }

unknown_sign   = "?"
modified_sign  = "~"
added_sign     = "+"
untracked_sign = "?"
ignored_sign   = "·"
deleted_sign   = "-"
updated_sign   = "!"
clean_sign     = ""
